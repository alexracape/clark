name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast-refactor-gate:
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Cargo registry and build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri -> target

      - name: Install Linux system dependencies for Tauri Rust tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: bun install

      - name: Build GUI dist for Tauri context
        run: bun run build:gui

      - name: Build sidecar for Tauri context
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [ "$RUNNER_ARCH" = "ARM64" ]; then
            bun run build:sidecar -- --target linux-arm64
          elif [ "$RUNNER_OS" = "Linux" ]; then
            bun run build:sidecar -- --target linux-x64
          elif [ "$RUNNER_OS" = "macOS" ] && [ "$RUNNER_ARCH" = "ARM64" ]; then
            bun run build:sidecar -- --target darwin-arm64
          elif [ "$RUNNER_OS" = "macOS" ]; then
            bun run build:sidecar -- --target darwin-x64
          fi
        if: matrix.os != 'windows-latest'

      - name: Run fast refactor test gate
        run: bun run test:refactor-fast
