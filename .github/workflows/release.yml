name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build CLI binary
        run: bun scripts/build.ts --target ${{ matrix.target }} --version ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/clark-${{ matrix.target }}
            dist/clark-${{ matrix.target }}.sha256

  build-desktop-macos:
    name: Build Desktop (macOS)
    runs-on: macos-latest
    env:
      TAG_VERSION: ${{ github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri -> target

      - name: Install dependencies
        run: bun install

      - name: Validate updater secrets
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY" && exit 1)
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD" && exit 1)
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || (echo "Missing TAURI_UPDATER_PUBLIC_KEY" && exit 1)

      - name: Sync desktop app version with git tag
        run: |
          VERSION="${TAG_VERSION#v}"
          jq --arg version "$VERSION" '.version = $version' tauri/tauri.conf.json > tauri/tauri.conf.json.tmp
          mv tauri/tauri.conf.json.tmp tauri/tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" tauri/Cargo.toml

      - name: Inject updater public key for build
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg_path = Path("tauri/tauri.conf.json")
          cfg = json.loads(cfg_path.read_text())
          cfg.setdefault("plugins", {})
          cfg["plugins"].setdefault("updater", {})
          cfg["plugins"]["updater"]["pubkey"] = __import__("os").environ["TAURI_UPDATER_PUBLIC_KEY"]
          cfg_path.write_text(json.dumps(cfg, indent=2) + "\n")
          PY

      - name: Build sidecar binaries for both architectures
        run: bun scripts/build-sidecar.ts --target darwin-arm64 --target darwin-x64

      - name: Build desktop artifacts
        working-directory: tauri
        run: bunx @tauri-apps/cli build --target universal-apple-darwin

      - name: Collect desktop release assets
        run: |
          mkdir -p dist/desktop
          find tauri/target/universal-apple-darwin/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp {} dist/desktop/ \;

          ARCHIVE_FILE="$(find dist/desktop -type f -name '*.app.tar.gz' | head -n 1)"
          test -n "$ARCHIVE_FILE" || (echo "No .app.tar.gz updater archive produced" && find tauri/target/universal-apple-darwin/release/bundle -type f | sed -n '1,120p' && exit 1)

          SIG_FILE="${ARCHIVE_FILE}.sig"
          test -f "$SIG_FILE" || (echo "Missing updater signature file: $SIG_FILE" && exit 1)
          SIGNATURE="$(cat "$SIG_FILE")"

          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_VERSION}/$(basename "$ARCHIVE_FILE")"
          VERSION="${TAG_VERSION#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg url "$DOWNLOAD_URL" \
            --arg signature "$SIGNATURE" \
            '{version: $version, pub_date: $pub_date, platforms: {"darwin-aarch64": {url: $url, signature: $signature}, "darwin-x86_64": {url: $url, signature: $signature}}}' \
            > dist/desktop/latest.json

          cp dist/desktop/latest.json dist/desktop/latest-macos.json

      - name: Validate updater metadata version
        run: |
          VERSION="${TAG_VERSION#v}"
          METADATA_FILE="dist/desktop/latest.json"
          test -f "$METADATA_FILE" || (echo "Updater metadata file was not generated at $METADATA_FILE" && exit 1)
          METADATA_VERSION="$(jq -r '.version // empty' "$METADATA_FILE")"
          test "$METADATA_VERSION" = "$VERSION" || (echo "Updater metadata version '$METADATA_VERSION' does not match tag '$VERSION'" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/desktop/*

  release:
    name: Publish GitHub Release
    needs: [build-cli, build-desktop-macos]
    if: ${{ always() && needs.build-cli.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build release note footer
        id: notes
        run: |
          if [ "${{ needs.build-desktop-macos.result }}" = "success" ]; then
            {
              echo "body=Desktop artifacts (macOS) and CLI artifacts were both built successfully."
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body=Desktop artifacts failed in this run. CLI assets were published. Re-run the desktop lane before announcing desktop availability."
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.notes.outputs.body }}
          files: artifacts/*
