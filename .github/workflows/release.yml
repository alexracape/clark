name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build CLI binary
        run: bun scripts/build.ts --target ${{ matrix.target }} --version ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/clark-${{ matrix.target }}
            dist/clark-${{ matrix.target }}.sha256

  build-desktop-macos:
    name: Build Desktop (macOS)
    runs-on: macos-latest
    env:
      TAG_VERSION: ${{ github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Validate updater secrets
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY" && exit 1)
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD" && exit 1)
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || (echo "Missing TAURI_UPDATER_PUBLIC_KEY" && exit 1)

      - name: Sync desktop app version with git tag
        run: |
          VERSION="${TAG_VERSION#v}"
          jq --arg version "$VERSION" '.version = $version' tauri/tauri.conf.json > tauri/tauri.conf.json.tmp
          mv tauri/tauri.conf.json.tmp tauri/tauri.conf.json

      - name: Inject updater public key for build
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg_path = Path("tauri/tauri.conf.json")
          cfg = json.loads(cfg_path.read_text())
          cfg.setdefault("plugins", {})
          cfg["plugins"].setdefault("updater", {})
          cfg["plugins"]["updater"]["pubkey"] = __import__("os").environ["TAURI_UPDATER_PUBLIC_KEY"]
          cfg_path.write_text(json.dumps(cfg, indent=2) + "\n")
          PY

      - name: Build desktop artifacts
        run: bun run tauri build

      - name: Validate updater metadata version
        run: |
          VERSION="${TAG_VERSION#v}"
          METADATA_FILE="$(find tauri/target/release/bundle -type f -name 'latest*.json' | head -n 1)"
          test -n "$METADATA_FILE" || (echo "No updater metadata generated" && exit 1)
          METADATA_VERSION="$(jq -r '.version // empty' "$METADATA_FILE")"
          test "$METADATA_VERSION" = "$VERSION" || (echo "Updater metadata version '$METADATA_VERSION' does not match tag '$VERSION'" && exit 1)

      - name: Collect desktop release assets
        run: |
          mkdir -p dist/desktop
          find tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -exec cp {} dist/desktop/ \;
          METADATA_FILE="$(find tauri/target/release/bundle -type f -name 'latest*.json' | head -n 1)"
          cp "$METADATA_FILE" dist/desktop/latest.json
          cp "$METADATA_FILE" dist/desktop/latest-macos.json

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/desktop/*

  release:
    name: Publish GitHub Release
    needs: [build-cli, build-desktop-macos]
    if: ${{ always() && needs.build-cli.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build release note footer
        id: notes
        run: |
          if [ "${{ needs.build-desktop-macos.result }}" = "success" ]; then
            {
              echo "body=Desktop artifacts (macOS) and CLI artifacts were both built successfully."
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body=Desktop artifacts failed in this run. CLI assets were published. Re-run the desktop lane before announcing desktop availability."
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.notes.outputs.body }}
          files: artifacts/*
