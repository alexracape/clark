<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clark GUI</title>
    <style>
      :root {
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: #1a202c;
        background: #f7fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(640px, 92vw);
        padding: 2rem;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Clark GUI scaffold is running</h1>
      <p>
        Tauri is now connected to the GUI directory instead of the Ink CLI
        entrypoint.
      </p>
    </main>
  </body>
</html>
